apiVersion: apps/v1
kind: Deployment
metadata:
  name: savepoint-lookup
  namespace: savepoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: savepoint-lookup
  template:
    metadata:
      labels:
        app: savepoint-lookup
    spec:
      containers:
        - name: lookup
          image: savepoint-lookup:phase2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: savepoint-secrets
                  key: ConnectionStrings__DefaultConnection
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: savepoint-lookup
  namespace: savepoint
spec:
  selector:
    app: savepoint-lookup
  ports:
    - name: http
      port: 8080
      targetPort: 8080
