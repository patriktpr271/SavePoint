apiVersion: apps/v1
kind: Deployment
metadata:
  name: savepoint-reviews
  namespace: savepoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: savepoint-reviews
  template:
    metadata:
      labels:
        app: savepoint-reviews
    spec:
      volumes:
        - name: dataprotection-keys
          persistentVolumeClaim:
            claimName: dataprotection-pvc
      containers:
        - name: reviews
          image: savepoint-reviews:phase2
          imagePullPolicy: Always
          volumeMounts:
            - name: dataprotection-keys
              mountPath: /root/.aspnet/DataProtection-Keys
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: savepoint-secrets
                  key: ConnectionStrings__DefaultConnection
            # AWS SDK config. AWS_REGION is required by the SDK; the queue URL
            # and DynamoDB table name come from a ConfigMap written by the
            # deploy script after `terraform apply`.
            - name: AWS_REGION
              value: us-east-1
            - name: AWS__ReviewEventsQueueUrl
              valueFrom:
                configMapKeyRef:
                  name: savepoint-aws-config
                  key: REVIEW_EVENTS_QUEUE_URL
                  optional: true
            - name: AWS__ReviewSentimentTable
              valueFrom:
                configMapKeyRef:
                  name: savepoint-aws-config
                  key: REVIEW_SENTIMENT_TABLE
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: savepoint-reviews
  namespace: savepoint
spec:
  selector:
    app: savepoint-reviews
  ports:
    - name: http
      port: 8080
      targetPort: 8080
