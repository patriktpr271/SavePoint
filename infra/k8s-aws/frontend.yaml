apiVersion: apps/v1
kind: Deployment
metadata:
  name: savepoint-frontend
  namespace: savepoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: savepoint-frontend
  template:
    metadata:
      labels:
        app: savepoint-frontend
    spec:
      containers:
        - name: frontend
          image: savepoint-frontend:phase2
          imagePullPolicy: Always
          ports:
            - containerPort: 4173
          readinessProbe:
            tcpSocket:
              port: 4173
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 4173
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: savepoint-frontend
  namespace: savepoint
spec:
  selector:
    app: savepoint-frontend
  ports:
    - name: http
      port: 4173
      targetPort: 4173
