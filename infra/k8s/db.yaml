apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: savepoint-db
  namespace: savepoint
spec:
  serviceName: savepoint-db
  replicas: 1
  selector:
    matchLabels:
      app: savepoint-db
  template:
    metadata:
      labels:
        app: savepoint-db
    spec:
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: savepoint-secrets
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: mssql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: savepoint-db
  namespace: savepoint
spec:
  selector:
    app: savepoint-db
  ports:
    - name: sql
      port: 1433
      targetPort: 1433
