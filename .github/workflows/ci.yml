name: CI - Build and Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore SavePointBackend/SavePointBackend.sln
      
    - name: Build
      run: dotnet build SavePointBackend/SavePointBackend.sln --configuration Release --no-restore
      
    - name: Test
      run: dotnet test SavePointBackend/SavePointBackend.sln --configuration Release --no-build --verbosity normal --blame-hang-timeout 5m
      timeout-minutes: 10

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: SavePointFrontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      working-directory: SavePointFrontend
      
    - name: Lint
      run: npm run lint
      working-directory: SavePointFrontend
      continue-on-error: true
      
    - name: Run Component Tests
      run: npm test -- --run
      working-directory: SavePointFrontend
      
    - name: Generate Test Coverage
      run: npm run test:coverage -- --run
      working-directory: SavePointFrontend
      continue-on-error: true
      
    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-coverage
        path: SavePointFrontend/coverage
        retention-days: 7
      
    - name: Build
      run: npm run build
      working-directory: SavePointFrontend
      
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: frontend-build
        path: SavePointFrontend/dist
        retention-days: 1

  e2e-tests:
    name: E2E Tests (Optional)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: SavePointFrontend/package-lock.json
    
    - name: Restore and Build Backend
      run: |
        dotnet restore SavePointBackend/SavePointBackend.sln
        dotnet build SavePointBackend/SavePointBackend.sln --configuration Release --no-restore
    
    - name: Start Backend Server
      run: |
        cd SavePointBackend/SavePoint.Host
        dotnet run --configuration Release &
        echo $! > backend.pid
        sleep 10
      env:
        ASPNETCORE_ENVIRONMENT: Test
    
    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: SavePointFrontend
    
    - name: Install Playwright Browsers
      run: npx playwright install chromium
      working-directory: SavePointFrontend
    
    - name: Run E2E Tests
      run: npm run test:e2e
      working-directory: SavePointFrontend
      continue-on-error: true
    
    - name: Upload E2E Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: SavePointFrontend/playwright-report
        retention-days: 7
    
    - name: Stop Backend Server
      if: always()
      run: |
        if [ -f SavePointBackend/SavePoint.Host/backend.pid ]; then
          kill $(cat SavePointBackend/SavePoint.Host/backend.pid) || true
        fi
