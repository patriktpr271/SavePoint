name: CI - Build and Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore SavePointBackend/SavePointBackend.sln
      
    - name: Build
      run: dotnet build SavePointBackend/SavePointBackend.sln --configuration Release --no-restore
      
    - name: Test
      run: dotnet test SavePointBackend/SavePointBackend.sln --configuration Release --no-build --verbosity normal

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: SavePointFrontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      working-directory: SavePointFrontend
      
    - name: Lint
      run: npm run lint
      working-directory: SavePointFrontend
      continue-on-error: true
      
    - name: Build
      run: npm run build
      working-directory: SavePointFrontend
      
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: frontend-build
        path: SavePointFrontend/dist
        retention-days: 1
