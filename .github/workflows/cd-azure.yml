name: CD - Deploy to Azure Production

on:
  push:
    branches: [ test ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  AZURE_WEBAPP_NAME: 'SavePoint' 
  AZURE_WEBAPP_PACKAGE_PATH: './publish'

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: SavePointFrontend/package-lock.json
    
    - name: Restore .NET dependencies
      run: dotnet restore SavePointBackend/SavePointBackend.sln
      
    - name: Build .NET solution
      run: dotnet build SavePointBackend/SavePointBackend.sln --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test SavePointBackend/SavePointBackend.sln --configuration Release --no-build --verbosity normal
      
    - name: Publish .NET application
      run: dotnet publish SavePointBackend/SavePoint.Host/SavePoint.Host.csproj --configuration Release --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --self-contained false
      
    - name: Verify publish output
      run: |
        echo "📦 Published files:"
        ls -la ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        echo ""
        echo "🔍 Checking for key files:"
        test -f "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/SavePoint.Host.dll" && echo "✅ SavePoint.Host.dll found" || echo "❌ SavePoint.Host.dll NOT found"
        test -f "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/web.config" && echo "✅ web.config found" || echo "❌ web.config NOT found"
        test -d "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/wwwroot" && echo "✅ wwwroot folder found" || echo "⚠️ wwwroot folder NOT found"
      
    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: webapp-package
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        retention-days: 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp-package
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    
    - name: Deploy to Azure Web App
      id: deploy-to-production
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    
    - name: Deployment Summary
      run: |
        echo "✅ Deployment completed successfully!"
        echo "🌐 Web App: ${{ env.AZURE_WEBAPP_NAME }}"
        echo "📦 Branch: ${{ github.ref_name }}"
        echo "👤 Triggered by: ${{ github.actor }}"
